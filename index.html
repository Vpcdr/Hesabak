<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابک</title>

<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f6f1e6;--c:#fffdf8;--t:#0a2438;--m:#6c7a86;--p:#0a2438;--pt:#f3e3b8;--a:#c9a86a;--r:#a4262c;--g:#1b7a4b;--b:#e5dcc6;--h:linear-gradient(135deg,#0a2438,#164a73);--sh:0 4px 14px rgba(10,36,56,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=turq]{--bg:#eef5f5;--c:#fff;--t:#12303a;--m:#627782;--p:#0f766e;--pt:#fff;--a:#f0b429;--r:#c62828;--b:#d5e3e5;--h:linear-gradient(135deg,#0f766e,#17a398)}
:root[data-theme=night]{--bg:#0d131a;--c:#17212b;--t:#e8eef4;--m:#93a1b0;--p:#c9a86a;--pt:#0a2438;--a:#c9a86a;--r:#ff7b7b;--g:#4fd18b;--b:#2a3745;--h:linear-gradient(135deg,#08111a,#12283a)}
:root[data-theme=emerald]{--bg:#eef4ee;--c:#fff;--t:#12301f;--m:#5d7566;--p:#1b5e3a;--a:#d4af37;--r:#b3261e;--b:#d3e2d6;--h:linear-gradient(135deg,#0f3b25,#1f7a4a)}
:root[data-theme=ruby]{--bg:#f8eff1;--c:#fff;--t:#34131a;--m:#86666d;--p:#7a1f33;--a:#d9b36c;--r:#b3261e;--b:#ead3d7;--h:linear-gradient(135deg,#5a1424,#9a2a43)}
:root[data-theme=sand]{--bg:#f3ece1;--c:#fbf7f0;--t:#3a2e22;--m:#85755f;--p:#8a5a2b;--pt:#fff;--a:#c98a3d;--r:#a63a2a;--g:#2f7a46;--b:#e0d3bd;--h:linear-gradient(135deg,#6e4520,#a8743c)}
*{box-sizing:border-box}html,body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--h);color:#f3e3b8;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--a)}
header b{flex:1;font-size:18px}header small{font-size:11px;opacity:.9}header button{background:rgba(255,255,255,.15);color:#f3e3b8;padding:7px 11px;border-color:transparent}
.plate{background:#f6f0e2;border-radius:10px;padding:4px 8px;display:inline-flex}.plate img{height:26px}
button,.btn{background:var(--p);color:var(--pt);border:1px solid var(--a);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
button.g{background:transparent;color:var(--t)}button.d{background:var(--r);color:#fff;border-color:var(--r)}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font-family:inherit}
main{padding:12px 12px 96px;max-width:760px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.row>*{flex:1}.row .s{flex:0 0 auto}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}#drawer.on{display:block}
#drawer nav{position:absolute;right:0;top:0;bottom:0;width:250px;background:var(--c);padding:16px 10px;overflow:auto;border-left:3px solid var(--a)}
#drawer nav a{display:block;padding:12px;border-radius:10px;cursor:pointer}#drawer nav a:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.tile{background:var(--c);border:1px solid var(--b);border-top:4px solid var(--a);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;font-size:30px;box-shadow:var(--sh)}.tile span{display:block;font-size:14px;margin-top:6px}
.tile.sel{outline:3px solid var(--a)}.sw{display:block!important;height:34px;border-radius:10px;margin:0 0 6px!important}.th{font-size:14px;padding:10px}
.banner{background:var(--h);color:#f3e3b8;border-radius:16px;padding:16px;margin-bottom:12px;border-bottom:4px solid var(--a)}
.hero{border:2px solid var(--a);text-align:center}.big{font-size:20px;font-weight:900;margin-top:6px}
.debt{font-weight:900;color:var(--r)}.cr{color:var(--g);font-weight:700}.m{color:var(--m);font-size:13px}
.rr{background:var(--c);border:1px solid var(--b);border-right:5px solid var(--a);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.rr input,.rr select{font-size:17px;padding:13px 10px}.rh{display:flex;justify-content:space-between;color:var(--m);margin-bottom:6px}.r3{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:6px;margin-top:6px}.rt{margin-top:8px;color:var(--m)}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:right;font-size:14px}th{color:var(--a)}
.tabs{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.tabs button{flex:1;background:transparent;color:var(--t)}.tabs .on{background:var(--a);color:#0a2438;font-weight:bold}
summary{cursor:pointer;font-weight:bold}
#login{max-width:340px;margin:8vh auto;padding:22px;text-align:center;background:var(--c);border-radius:22px;box-shadow:var(--sh);border:1px solid var(--b);border-top:5px solid var(--a)}#login .plate{padding:10px 20px}#login .plate img{height:84px}
footer{text-align:center;color:var(--m);font-size:12px;padding:16px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:2px solid var(--a);padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));z-index:6}
#bar a{flex:1;text-align:center;padding:8px 2px;font-size:20px;cursor:pointer}#bar small{display:block;font-size:11px;color:var(--m)}
#md,#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow:auto;display:flex;justify-content:center;padding:16px}#md .card{margin-top:20vh;width:100%;max-width:360px;height:fit-content}.ovb{width:100%;max-width:520px}.ovb img{width:100%;border-radius:12px;margin-bottom:10px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--p);color:var(--pt);border:1px solid var(--a);padding:10px 18px;border-radius:22px;z-index:30}
@media print{header,footer,#bar,#drawer,.np,.toast{display:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ini=()=>({u:'AdMiN',p:'21148996',prof:{banks:[]},items:[],people:[],inv:[],man:[],notes:''});
let D;try{D=JSON.parse(localStorage.getItem('hesabak'))}catch(e){}D=D||ini();
const save=()=>{try{localStorage.setItem('hesabak',JSON.stringify(D))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10),fd=d=>d?new Date(d).toLocaleDateString('fa-IR'):'',fn=n=>Math.round(n).toLocaleString('en-US').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),fq=n=>String(+(+n).toFixed(3)).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)),pn=v=>+en(v).replace(/[^\d.]/g,'')||0;
let view='home',who=null,auth=false,rows=0;
const MENU=[['home','🏠 خانه'],['inv','🧾 فاکتور جدید'],['acc','📒 حساب و کتاب'],['rep','📊 گزارشات'],['stock','📦 موجودی کالا'],['notes','📝 یادداشت'],['prof','👤 پروفایل'],['set','⚙️ تنظیمات']];
function nowStr(){const d=new Date();return d.toLocaleDateString('fa-IR')+' — '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
setInterval(()=>{const e=$('#clk');if(e)e.textContent=nowStr()},20000);
let H=[];
function go(v,w){if(v!==view||(w||null)!==who){H.push([view,who]);if(H.length>30)H.shift()}view=v;who=w||null;$('#drawer')&&$('#drawer').classList.remove('on');draw();scrollTo(0,0)}
function back(){const p=H.pop();if(p){view=p[0];who=p[1];draw();scrollTo(0,0)}else go('home')}
function draw(){
 if(!auth){$('#app').innerHTML=`<div id="login"><div class="plate"><img src="${LOGO}"></div><h2>حسابک</h2><p class="m">حسابداری ساده برای کسب‌وکارهای کوچک</p><p><input id="lu" placeholder="نام کاربری" autocomplete="username"></p><p><input id="lp" type="password" placeholder="رمز عبور" autocomplete="current-password"></p><button style="width:100%" onclick="login()">ورود</button><p id="le" class="debt"></p></div><footer>ساخته شده توسط VPCDR · ${VER}</footer>`;return}
 const dr=`<div id="drawer" onclick="this.classList.remove('on')"><nav onclick="event.stopPropagation()">${MENU.map(m=>`<a onclick="go('${m[0]}')">${m[1]}</a>`).join('')}<a onclick="auth=false;draw()">🔒 قفل</a></nav></div>`;
 $('#app').innerHTML=`<header class="np"><button onclick="$('#drawer').classList.add('on')">☰</button><button onclick="back()">→</button><button onclick="go('home')">🏠</button><b>حسابک</b><span class="plate"><img src="${LOGO}"></span></header>${dr}<main id="v"></main><footer>ساخته شده توسط VPCDR · ${VER}<br><span id="clk">${nowStr()}</span></footer><nav id="bar" class="np"><a onclick="back()">→<small>عقب</small></a><a onclick="go('home')">🏠<small>خانه</small></a><a onclick="go('inv')">🧾<small>فاکتور</small></a><a onclick="go('acc')">📒<small>حساب</small></a><a onclick="go('rep')">📊<small>گزارش</small></a></nav>`;
 V[view]();
}
function login(){if($('#lu').value===D.u&&$('#lp').value===D.p){auth=true;draw()}else $('#le').textContent='نام کاربری یا رمز اشتباه است'}
const tot=i=>i.rows.reduce((s,r)=>s+r.q*r.p,0);
const bal=n=>D.inv.filter(i=>i.who===n&&i.pay==='credit').reduce((s,i)=>s+(i.type==='sell'?1:-1)*tot(i),0)+D.man.filter(m=>m.who===n).reduce((s,m)=>s+m.amt,0);
const names=()=>[...new Set([...D.people.map(p=>p.n),...D.inv.map(i=>i.who),...D.man.map(m=>m.who)].filter(Boolean))];
function alarms(){return D.inv.filter(i=>i.alarm&&!i.done&&i.alarm<=today()&&(i.pay==='credit'||i.sub==='check'))}
function smsText(n,a){return `سلام ${n} عزیز، مبلغ ${fn(a)} تومان از حساب شما نزد ${D.prof.name||''} ${D.prof.job||''} باقی است. لطفا نسبت به تسویه حساب اقدام فرمایید. با تشکر`}
function tel(n){return(D.people.find(p=>p.n===n)||{}).ph||''}
const V={
home(){const al=alarms(),rc=names().reduce((a,n)=>a+Math.max(bal(n),0),0);$('#v').innerHTML=`<div class="banner"><div>${E(D.prof.name||'خوش آمدید')}</div><div style="font-size:13px;margin-top:6px;opacity:.85">طلب از مشتریان</div><div style="font-size:28px;font-weight:900">${fn(rc)} <small style="font-size:13px">تومان</small></div></div><div class="grid">${[['inv','🧾','فاکتور جدید'],['acc','📒','حساب و کتاب'],['rep','📊','گزارشات'],['stock','📦','موجودی'],['notes','📝','یادداشت'],['prof','👤','پروفایل']].map(t=>`<div class="tile" onclick="go('${t[0]}')">${t[1]}<span>${t[2]}</span></div>`).join('')}</div>
<h3>⏰ یادآورها (${fn(al.length)})</h3>${al.map(i=>{const a=tot(i);return `<div class="card"><b>${E(i.who)}</b> · ${i.pay==='credit'?'نسیه':'چک'} · <span class="debt">${fn(a)}</span><div class="m">سررسید: ${fd(i.alarm)}</div><div class="row" style="margin-top:6px"><a class="btn s" href="sms:${tel(i.who)}?body=${encodeURIComponent(smsText(i.who,a))}">💬 پیامک</a><a class="btn s" href="tel:${tel(i.who)}">📞 تماس</a><button class="g s" onclick="D.inv.find(x=>x.id==${i.id}).done=1;save();draw()">انجام شد</button></div></div>`}).join('')||'<p class="m">یادآوری سررسید شده‌ای نیست.</p>'}`},
inv(){rows=0;$('#v').innerHTML=`<div class="card"><div class="tabs"><button id="t1" class="on" onclick="setT('sell')">فروش</button><button id="t2" onclick="setT('buy')">خرید</button></div>
<div class="row"><input id="fw" list="pl" placeholder="نام طرف حساب"><input id="fdt" type="date" value="${today()}"></div><datalist id="pl">${names().map(n=>`<option value="${E(n)}">`).join('')}</datalist>
<input id="fph" placeholder="تلفن طرف حساب (اختیاری)" style="margin-bottom:8px"><div id="rw"></div><button class="g" onclick="addRow()">+ ردیف</button>
<h4>وضعیت پرداخت</h4><div class="tabs"><button id="p1" class="on" onclick="setP('credit')">نسیه</button><button id="p2" onclick="setP('cash')">نقد</button></div>
<div id="cashbox" style="display:none"><div class="tabs">${[['check','چک'],['bank','واریز به بانک'],['pos','کارتخوان'],['manual','دستی']].map((x,i)=>`<button id="s_${x[0]}" class="${i?'':'on'}" onclick="setS('${x[0]}')">${x[1]}</button>`).join('')}</div>
<textarea id="cnote" rows="2" placeholder="یادداشت چک (با نوشتن، کادر بزرگ‌تر می‌شود)" style="display:block" oninput="this.rows=Math.min(Math.max(2,this.value.split('\\n').length+1,Math.ceil(this.value.length/35)),20)"></textarea></div>
<div id="albox" style="margin-top:8px"><label class="m">تاریخ آلارم (سررسید)</label><input id="fal" type="date"></div>
<h3>جمع: <span id="sum">۰</span> تومان</h3><button style="width:100%" onclick="saveInv()">ثبت فاکتور</button></div>
<h3>فاکتورهای اخیر</h3>${D.inv.slice(-8).reverse().map(i=>`<div class="card"><b>${E(i.who)}</b> · ${i.type==='sell'?'فروش':'خرید'} · ${fn(tot(i))} · <span class="m">${fd(i.date)} · ${i.pay==='credit'?'نسیه':'نقد'}</span> <button class="d s" onclick="ask('حذف شود؟',()=>{D.inv=D.inv.filter(x=>x.id!=${i.id});save();draw()})">🗑</button></div>`).join('')}`;
 F={type:'sell',pay:'credit',sub:'check'};addRow()},
acc(){if(who)return V.sheet();const q=($('#q')||{}).value||'';$('#v').innerHTML=`<input id="q" class="np" placeholder="🔍 جستجوی نام" oninput="accL()" style="margin-bottom:8px"><div class="card"><div class="row"><input id="np" placeholder="مشتری جدید"><input id="nph" placeholder="تلفن"><button class="s" onclick="addP()">+</button></div></div><div id="al"></div>`;accL()},
sheet(){const n=who,es=led(n),pe=D.people.find(p=>p.n===n)||{},b=bal(n);let run=0;$('#v').innerHTML=`<div class="card hero"><h2 style="margin:0">${E(n)}</h2><div class="${b>0?'debt':'cr'} big">${b>0?'بدهکار':b<0?'بستانکار':'تسویه'}: ${fn(Math.abs(b))} تومان</div></div>
<details class="card np"><summary>👤 پروفایل مشتری</summary><p><label class="m">نام</label><input id="cn" value="${E(n)}"></p><p><label class="m">تلفن</label><input id="cp" inputmode="tel" value="${E(pe.ph)}"></p><p><label class="m">آدرس / توضیح</label><textarea id="ca" rows="2">${E(pe.addr)}</textarea></p><button onclick="saveCust()">💾 ذخیره</button></details>
<div class="card" style="overflow-x:auto"><table><tr><th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>مانده</th><th class="np"></th></tr>${es.map(e=>{run+=e.a;return `<tr><td>${fd(e.d)}</td><td>${E(e.t)}</td><td class="${e.a>0?'debt':'cr'}">${fn(Math.abs(e.a))}</td><td>${fn(run)}</td><td class="np">${e.k==='m'?`<a onclick="edM(${e.id})">✏️</a> `:''}<a onclick="delE('${e.k}',${e.id})">🗑</a></td></tr>`}).join('')}</table></div>
<div class="card np"><div class="row"><input id="ma" inputmode="numeric" placeholder="مبلغ" oninput="fi(this)"><select id="mk"><option value="-1">دریافت از او</option><option value="1">پرداخت به او</option></select></div><input id="mn" placeholder="شرح" style="margin-bottom:6px"><button onclick="addM()">ثبت</button></div>
<div class="row np"><button onclick="stmt()">🖼 عکس / PDF لوکس</button></div><div class="row np"><a class="btn" href="sms:${tel(n)}?body=${encodeURIComponent(smsText(n,Math.max(b,0)))}">💬 پیامک</a><a class="btn" href="tel:${tel(n)}">📞 تماس</a></div>`},
rep(){const M={};D.inv.forEach(i=>{const k=i.date.slice(0,7);M[k]=M[k]||{s:0,b:0};M[k][i.type==='sell'?'s':'b']+=tot(i)});const ks=Object.keys(M).sort().slice(-6),mx=Math.max(1,...ks.map(k=>Math.max(M[k].s,M[k].b)));
 const S=D.inv.filter(i=>i.type==='sell').reduce((s,i)=>s+tot(i),0),B=D.inv.filter(i=>i.type==='buy').reduce((s,i)=>s+tot(i),0),ns=names().map(n=>[n,bal(n)]),rc=ns.filter(x=>x[1]>0).reduce((s,x)=>s+x[1],0),py=-ns.filter(x=>x[1]<0).reduce((s,x)=>s+x[1],0);
