<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابک</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#1d2733;--m:#6b7785;--p:#0f766e;--r:#c62828;--b:#dde3e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181f;--c:#1b242d;--t:#e6edf3;--m:#93a1b0;--p:#2dd4bf;--r:#ef5350;--b:#2c3946}}
*{box-sizing:border-box}html,body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--p);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{flex:1}header small{font-size:12px;opacity:.9}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--p);border:1px solid var(--p)}button.d{background:var(--r)}
header button{background:rgba(255,255,255,.2)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
main{padding:12px;max-width:760px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.row>*{flex:1}.row .s{flex:0 0 auto}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}#drawer.on{display:block}
#drawer nav{position:absolute;right:0;top:0;bottom:0;width:240px;background:var(--c);padding:16px 10px;overflow:auto}
#drawer nav a{display:block;padding:11px;border-radius:8px;cursor:pointer}#drawer nav a:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;text-align:center;cursor:pointer}
.debt{font-weight:900;color:var(--r)}.cr{color:var(--p);font-weight:700}.m{color:var(--m);font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:right;font-size:14px}
.tabs{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.tabs button{flex:1}.tabs .on{background:var(--p);color:#fff}
#login{max-width:340px;margin:12vh auto;padding:16px}footer{text-align:center;color:var(--m);font-size:12px;padding:16px}
@media print{header,footer,#drawer,.np{display:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VER='Ver10.0Abivard',UNITS=['عدد','متر','کیلوگرم','گرم','یارد','لیتر','بسته','جفت','خدمات'];
const ini=()=>({u:'AdMiN',p:'21148996',prof:{banks:[]},items:[],people:[],inv:[],man:[],notes:''});
let D;try{D=JSON.parse(localStorage.getItem('hesabak'))}catch(e){}D=D||ini();
const save=()=>{try{localStorage.setItem('hesabak',JSON.stringify(D))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10),fd=d=>d?new Date(d).toLocaleDateString('fa-IR'):'',fn=n=>Math.round(n).toLocaleString('fa-IR');
let view='home',who=null,auth=false,rows=0;
const MENU=[['home','🏠 خانه'],['inv','🧾 فاکتور جدید'],['acc','📒 حساب و کتاب'],['rep','📊 گزارشات'],['stock','📦 موجودی کالا'],['notes','📝 یادداشت'],['prof','👤 پروفایل'],['set','⚙️ تنظیمات']];
function nowStr(){const d=new Date();return d.toLocaleDateString('fa-IR')+' — '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
setInterval(()=>{const e=$('#clk');if(e)e.textContent=nowStr()},20000);
function go(v,w){view=v;who=w||null;$('#drawer')&&$('#drawer').classList.remove('on');draw()}
function draw(){
 if(!auth){$('#app').innerHTML=`<div id="login" class="card"><h2 style="text-align:center">🧮 حسابک</h2><p><input id="lu" placeholder="نام کاربری"></p><p><input id="lp" type="password" placeholder="رمز عبور"></p><button style="width:100%" onclick="login()">ورود</button><p id="le" class="debt"></p></div><footer>ساخته شده توسط VPCDR · ${VER}</footer>`;return}
 const dr=`<div id="drawer" onclick="this.classList.remove('on')"><nav onclick="event.stopPropagation()">${MENU.map(m=>`<a onclick="go('${m[0]}')">${m[1]}</a>`).join('')}<a onclick="auth=false;draw()">🔒 قفل</a></nav></div>`;
 $('#app').innerHTML=`<header class="np"><button onclick="$('#drawer').classList.add('on')">☰</button><b>🧮 حسابک</b><small id="clk">${nowStr()}</small></header>${dr}<main id="v"></main><footer>ساخته شده توسط VPCDR · ${VER}</footer>`;
 V[view]();
}
function login(){if($('#lu').value===D.u&&$('#lp').value===D.p){auth=true;draw()}else $('#le').textContent='نام کاربری یا رمز اشتباه است'}
const tot=i=>i.rows.reduce((s,r)=>s+r.q*r.p,0);
const bal=n=>D.inv.filter(i=>i.who===n&&i.pay==='credit').reduce((s,i)=>s+(i.type==='sell'?1:-1)*tot(i),0)+D.man.filter(m=>m.who===n).reduce((s,m)=>s+m.amt,0);
const names=()=>[...new Set([...D.people.map(p=>p.n),...D.inv.map(i=>i.who),...D.man.map(m=>m.who)].filter(Boolean))];
function alarms(){return D.inv.filter(i=>i.alarm&&!i.done&&i.alarm<=today()&&(i.pay==='credit'||i.sub==='check'))}
function smsText(n,a){return `سلام ${n} عزیز، مبلغ ${fn(a)} تومان از حساب شما نزد ${D.prof.name||''} ${D.prof.job||''} باقی است. لطفا نسبت به تسویه حساب اقدام فرمایید. با تشکر`}
function tel(n){return(D.people.find(p=>p.n===n)||{}).ph||''}
const V={
home(){const al=alarms();$('#v').innerHTML=`<div class="grid"><div class="tile" onclick="go('inv')">🧾<br>فاکتور جدید</div><div class="tile" onclick="go('acc')">📒<br>حساب و کتاب</div><div class="tile" onclick="go('rep')">📊<br>گزارشات</div><div class="tile" onclick="go('stock')">📦<br>موجودی</div></div>
<h3>⏰ یادآورها (${fn(al.length)})</h3>${al.map(i=>{const a=tot(i);return `<div class="card"><b>${E(i.who)}</b> · ${i.pay==='credit'?'نسیه':'چک'} · <span class="debt">${fn(a)}</span><div class="m">سررسید: ${fd(i.alarm)}</div><div class="row" style="margin-top:6px"><a class="btn s" href="sms:${tel(i.who)}?body=${encodeURIComponent(smsText(i.who,a))}">💬 پیامک</a><a class="btn s" href="tel:${tel(i.who)}">📞 تماس</a><button class="g s" onclick="D.inv.find(x=>x.id==${i.id}).done=1;save();draw()">انجام شد</button></div></div>`}).join('')||'<p class="m">یادآوری سررسید شده‌ای نیست.</p>'}`},
inv(){rows=0;$('#v').innerHTML=`<div class="card"><div class="tabs"><button id="t1" class="on" onclick="setT('sell')">فروش</button><button id="t2" onclick="setT('buy')">خرید</button></div>
<div class="row"><input id="fw" list="pl" placeholder="نام طرف حساب"><input id="fdt" type="date" value="${today()}"></div><datalist id="pl">${names().map(n=>`<option value="${E(n)}">`).join('')}</datalist>
<input id="fph" placeholder="تلفن طرف حساب (اختیاری)" style="margin-bottom:8px"><div id="rw"></div><button class="g" onclick="addRow()">+ ردیف</button>
<h4>وضعیت پرداخت</h4><div class="tabs"><button id="p1" class="on" onclick="setP('credit')">نسیه</button><button id="p2" onclick="setP('cash')">نقد</button></div>
<div id="cashbox" style="display:none"><div class="tabs">${[['check','چک'],['bank','واریز به بانک'],['pos','کارتخوان'],['manual','دستی']].map((x,i)=>`<button id="s_${x[0]}" class="${i?'':'on'}" onclick="setS('${x[0]}')">${x[1]}</button>`).join('')}</div>
<textarea id="cnote" rows="2" placeholder="یادداشت چک (با نوشتن، کادر بزرگ‌تر می‌شود)" style="display:block" oninput="this.rows=Math.min(Math.max(2,this.value.split('\\n').length+1,Math.ceil(this.value.length/35)),20)"></textarea></div>
<div id="albox" style="margin-top:8px"><label class="m">تاریخ آلارم (سررسید)</label><input id="fal" type="date"></div>
<h3>جمع: <span id="sum">۰</span> تومان</h3><button style="width:100%" onclick="saveInv()">ثبت فاکتور</button></div>
<h3>فاکتورهای اخیر</h3>${D.inv.slice(-8).reverse().map(i=>`<div class="card"><b>${E(i.who)}</b> · ${i.type==='sell'?'فروش':'خرید'} · ${fn(tot(i))} · <span class="m">${fd(i.date)} · ${i.pay==='credit'?'نسیه':'نقد'}</span> <button class="d s" onclick="if(confirm('حذف شود؟')){D.inv=D.inv.filter(x=>x.id!=${i.id});save();draw()}">🗑</button></div>`).join('')}`;
 F={type:'sell',pay:'credit',sub:'check'};addRow()},
acc(){if(who)return V.sheet();const q=($('#q')||{}).value||'';$('#v').innerHTML=`<input id="q" class="np" placeholder="🔍 جستجوی نام" oninput="accL()" style="margin-bottom:8px"><div class="card"><div class="row"><input id="np" placeholder="مشتری جدید"><input id="nph" placeholder="تلفن"><button class="s" onclick="addP()">+</button></div></div><div id="al"></div>`;accL()},
sheet(){const n=who,ents=[...D.inv.filter(i=>i.who===n&&i.pay==='credit').map(i=>({d:i.date,t:(i.type==='sell'?'فاکتور فروش':'فاکتور خرید')+' '+i.rows.map(r=>r.d).join('، '),a:(i.type==='sell'?1:-1)*tot(i),k:'i',id:i.id})),...D.man.filter(m=>m.who===n).map(m=>({d:m.date,t:m.note||(m.amt<0?'دریافت':'پرداخت'),a:m.amt,k:'m',id:m.id}))].sort((a,b)=>a.d<b.d?-1:1);let run=0;
 $('#v').innerHTML=`<div id="pa"><div class="card"><button class="g np" onclick="go('acc')">→ بازگشت</button><h2>${E(n)} <small class="m">${E(tel(n))}</small></h2><h3 class="${bal(n)>0?'debt':'cr'}">${bal(n)>0?'بدهکار':'بستانکار'}: ${fn(Math.abs(bal(n)))} تومان</h3>
 <table><tr><th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>مانده</th><th class="np"></th></tr>${ents.map(e=>{run+=e.a;return `<tr><td>${fd(e.d)}</td><td>${E(e.t)}</td><td>${fn(e.a)}</td><td>${fn(run)}</td><td class="np">${e.k==='m'?`<a onclick="edM(${e.id})">✏️</a> `:''}<a onclick="delE('${e.k}',${e.id})">🗑</a></td></tr>`}).join('')}</table></div></div>
 <div class="card np"><div class="row"><input id="ma" type="number" placeholder="مبلغ"><select id="mk"><option value="-1">دریافت از او</option><option value="1">پرداخت به او</option></select></div><input id="mn" placeholder="شرح" style="margin-bottom:6px"><button onclick="addM()">ثبت</button></div>
 <div class="row np"><button onclick="window.print()">🖨 چاپ / PDF</button><a class="btn" href="sms:${tel(n)}?body=${encodeURIComponent(smsText(n,Math.max(bal(n),0)))}">💬 پیامک</a><a class="btn" href="tel:${tel(n)}">📞</a></div>`},
rep(){const M={};D.inv.forEach(i=>{const k=i.date.slice(0,7);M[k]=M[k]||{s:0,b:0};M[k][i.type==='sell'?'s':'b']+=tot(i)});const ks=Object.keys(M).sort().slice(-6),mx=Math.max(1,...ks.map(k=>Math.max(M[k].s,M[k].b)));
 const S=D.inv.filter(i=>i.type==='sell').reduce((s,i)=>s+tot(i),0),B=D.inv.filter(i=>i.type==='buy').reduce((s,i)=>s+tot(i),0),ns=names().map(n=>[n,bal(n)]),rc=ns.filter(x=>x[1]>0).reduce((s,x)=>s+x[1],0),py=-ns.filter(x=>x[1]<0).reduce((s,x)=>s+x[1],0);
 const top={};D.inv.filter(i=>i.type==='sell').forEach(i=>i.rows.forEach(r=>top[r.d]=(top[r.d]||0)+r.q*r.p));
 $('#v').innerHTML=`<div class="grid"><div class="card">فروش کل<br><b class="cr">${fn(S)}</b></div><div class="card">خرید کل<br><b>${fn(B)}</b></div><div class="card">سود ناخالص<br><b>${fn(S-B)}</b></div><div class="card">طلب از مشتریان<br><b class="debt">${fn(rc)}</b></div><div class="card">بدهی من<br><b>${fn(py)}</b></div><div class="card">تعداد فاکتور<br><b>${fn(D.inv.length)}</b></div></div>
 <div class="card"><b>فروش و خرید ماهانه</b><svg viewBox="0 0 300 140" style="width:100%">${ks.map((k,i)=>`<rect x="${i*50+8}" y="${120-M[k].s/mx*100}" width="16" height="${M[k].s/mx*100}" fill="var(--p)"/><rect x="${i*50+26}" y="${120-M[k].b/mx*100}" width="16" height="${M[k].b/mx*100}" fill="var(--r)"/><text x="${i*50+25}" y="134" font-size="8" text-anchor="middle" fill="var(--m)">${E(new Date(k+'-15').toLocaleDateString('fa-IR',{month:'short'}))}</text>`).join('')}</svg><span class="cr">■ فروش</span> <span class="debt">■ خرید</span></div>
 <div class="card"><b>پرفروش‌ترین‌ها</b>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>`<div class="row"><span>${E(x[0])}</span><span class="s">${fn(x[1])}</span></div>`).join('')||'<p class="m">داده‌ای نیست</p>'}</div>
 <div class="card"><b>بدهکاران برتر</b>${ns.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>`<div class="row"><span>${E(x[0])}</span><span class="s debt">${fn(x[1])}</span></div>`).join('')||'<p class="m">ندارید</p>'}</div><button onclick="window.print()" class="np">🖨 چاپ گزارش</button>`},
stock(){$('#v').innerHTML=`<div class="card"><div class="row"><input id="ni" placeholder="نام کالا"><select id="nu">${UNITS.filter(u=>u!=='خدمات').map(u=>`<option>${u}</option>`).join('')}</select></div><div class="row"><input id="nq" type="number" placeholder="موجودی اولیه"><button class="s" onclick="addI()">+ افزودن کالا</button></div></div><div class="card"><table>${D.items.map((x,i)=>`<tr><td>${E(x.n)}</td><td>${fn(x.q)} ${E(x.u)}</td><td><a onclick="D.items.splice(${i},1);save();draw()">🗑</a></td></tr>`).join('')||'<tr><td class="m">کالایی ثبت نشده</td></tr>'}</table></div>`},
notes(){$('#v').innerHTML=`<textarea id="nt" rows="16" placeholder="یادداشت‌ها..." oninput="D.notes=this.value;save()">${E(D.notes)}</textarea>`},
prof(){const p=D.prof;$('#v').innerHTML=`<div class="card">${['name:نام و نام خانوادگی','job:شغل','tel:تلفن','card:شماره کارت','sheba:شماره شبا','acct:شماره حساب'].map(s=>{const[k,l]=s.split(':');return `<p><label class="m">${l}</label><input value="${E(p[k])}" onchange="D.prof['${k}']=this.value;save()"></p>`}).join('')}
 <b>حساب‌های بانکی</b>${p.banks.map((b,i)=>`<div class="row"><input value="${E(b.bank)}" placeholder="بانک" onchange="D.prof.banks[${i}].bank=this.value;save()"><input value="${E(b.card)}" placeholder="کارت" onchange="D.prof.banks[${i}].card=this.value;save()"><input value="${E(b.sheba)}" placeholder="شبا" onchange="D.prof.banks[${i}].sheba=this.value;save()"><input value="${E(b.acct)}" placeholder="حساب" onchange="D.prof.banks[${i}].acct=this.value;save()"><a class="s" onclick="D.prof.banks.splice(${i},1);save();draw()">🗑</a></div>`).join('')}<button class="g" onclick="D.prof.banks.push({});save();draw()">+ بانک</button>
 ${[['logo','لوگو (PNG/تصویر)'],['photo','عکس پرسنلی'],['stamp','مهر (PNG)']].map(x=>`<p><label class="m">${x[1]}</label><br>${p[x[0]]?`<img src="${p[x[0]]}" style="max-height:70px"><br>`:''}<input type="file" accept="image/*" onchange="img(this,'${x[0]}')"></p>`).join('')}</div>`},
set(){$('#v').innerHTML=`<div class="card"><b>قفل برنامه</b><p><input id="su" value="${E(D.u)}" placeholder="نام کاربری"></p><p><input id="sp" value="${E(D.p)}" placeholder="رمز عبور"></p><button onclick="D.u=$('#su').value;D.p=$('#sp').value;save();alert('ذخیره شد')">ذخیره</button></div>
 <div class="card"><b>بازنشانی</b><p class="m">برای فعال‌سازی، رمز ورود را وارد کنید.</p><input id="rp" type="password" placeholder="رمز ورود" oninput="['r1','r2','r3'].forEach(i=>$('#'+i).disabled=this.value!==D.p)"><div class="row" style="margin-top:8px"><button id="r1" class="d" disabled onclick="rst(1)">نرم: حذف فاکتور و اسناد</button></div><div class="row"><button id="r2" class="d" disabled onclick="rst(2)">سخت: حذف همه به‌جز تنظیمات</button></div><div class="row"><button id="r3" class="d" disabled onclick="rst(3)">کل: بازگشت به روز اول</button></div></div>
 <div class="card m">حسابک ${VER}<br>ساخته شده توسط VPCDR</div>`}};
let F={};
function setT(t){F.type=t;$('#t1').className=t==='sell'?'on':'';$('#t2').className=t==='buy'?'on':''}
function setP(p){F.pay=p;$('#p1').className=p==='credit'?'on':'';$('#p2').className=p==='cash'?'on':'';$('#cashbox').style.display=p==='cash'?'block':'none';sh()}
function setS(s){F.sub=s;['check','bank','pos','manual'].forEach(k=>$('#s_'+k).className=k===s?'on':'');sh()}
function sh(){$('#cnote').style.display=F.pay==='cash'&&F.sub==='check'?'block':'none';$('#albox').style.display=(F.pay==='credit'||F.sub==='check')?'block':'none'}
function addRow(){const id=rows++;const d=document.createElement('div');d.className='row rr';d.innerHTML=`<input class="rd" placeholder="شرح کالا" list="il" style="flex:2"><select class="ru" style="flex:1.2">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select><input class="rq" type="number" placeholder="تعداد" oninput="sm()"><input class="rp" type="number" placeholder="قیمت واحد" oninput="sm()">`;$('#rw').appendChild(d);if(!$('#il'))$('#rw').insertAdjacentHTML('afterend',`<datalist id="il">${D.items.map(x=>`<option value="${E(x.n)}">`).join('')}</datalist>`)}
function sm(){let s=0;document.querySelectorAll('.rr').forEach(r=>s+=(+r.querySelector('.rq').value||0)*(+r.querySelector('.rp').value||0));$('#sum').textContent=fn(s)}
function saveInv(){const w=$('#fw').value.trim();if(!w)return alert('نام طرف حساب را وارد کنید');const rs=[...document.querySelectorAll('.rr')].map(r=>({d:r.querySelector('.rd').value.trim(),u:r.querySelector('.ru').value,q:+r.querySelector('.rq').value||0,p:+r.querySelector('.rp').value||0})).filter(r=>r.d&&r.q);if(!rs.length)return alert('حداقل یک ردیف کالا لازم است');
 rs.forEach(r=>{if(r.u==='خدمات')return;let it=D.items.find(x=>x.n===r.d);if(!it){it={n:r.d,u:r.u,q:0};D.items.push(it)}it.q+=(F.type==='buy'?1:-1)*r.q});
 const ph=$('#fph').value.trim();let pe=D.people.find(p=>p.n===w);if(!pe)D.people.push({n:w,ph});else if(ph)pe.ph=ph;
 D.inv.push({id:Date.now(),type:F.type,who:w,date:$('#fdt').value||today(),rows:rs,pay:F.pay,sub:F.pay==='cash'?F.sub:'',note:F.pay==='cash'&&F.sub==='check'?$('#cnote').value:'',alarm:$('#albox').style.display!=='none'?$('#fal').value:''});save();alert('فاکتور ثبت شد');go('home')}
function accL(){const q=$('#q').value.trim();$('#al').innerHTML=names().filter(n=>n.includes(q)).map(n=>{const b=bal(n);return `<div class="card" onclick="go('acc',${JSON.stringify(n).replace(/"/g,'&quot;')})" style="cursor:pointer;display:flex"><b style="flex:1">${E(n)}</b>${b>0?`<span class="debt">بدهکار ${fn(b)}</span>`:b<0?`<span class="cr">بستانکار ${fn(-b)}</span>`:'<span class="m">تسویه</span>'}</div>`}).join('')||'<p class="m">موردی نیست</p>'}
function addP(){const n=$('#np').value.trim();if(!n)return;D.people.push({n,ph:$('#nph').value.trim()});save();draw()}
function addM(){const a=+$('#ma').value;if(!a)return;D.man.push({id:Date.now(),who,date:today(),amt:a*$('#mk').value,note:$('#mn').value});save();draw()}
function edM(id){const m=D.man.find(x=>x.id===id),a=prompt('مبلغ',Math.abs(m.amt)),n=prompt('شرح',m.note||'');if(a!==null){m.amt=(m.amt<0?-1:1)*(+a||0);m.note=n||'';save();draw()}}
function delE(k,id){if(!confirm('حذف شود؟'))return;if(k==='i')D.inv=D.inv.filter(x=>x.id!==id);else D.man=D.man.filter(x=>x.id!==id);save();draw()}
function addI(){const n=$('#ni').value.trim();if(!n)return;D.items.push({n,u:$('#nu').value,q:+$('#nq').value||0});save();draw()}
function img(el,k){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{D.prof[k]=r.result;save();draw()};r.readAsDataURL(f)}
function rst(l){if(!confirm('مطمئن هستید؟ این کار قابل بازگشت نیست.'))return;if(l===1){D.inv=[];D.man=[]}else if(l===2){const u=D.u,p=D.p;D=ini();D.u=u;D.p=p}else D=ini();save();if(l===3)auth=false;draw()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!auth&&$('#lp'))login()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
draw();
</script></body></html>
