<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابک</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f6f1e6;--c:#fffdf8;--t:#0a2438;--m:#6c7a86;--p:#0a2438;--pt:#f3e3b8;--a:#c9a86a;--r:#a4262c;--g:#1b7a4b;--b:#e5dcc6;--h:linear-gradient(135deg,#0a2438,#164a73);--sh:0 4px 14px rgba(10,36,56,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=turq]{--bg:#eef5f5;--c:#fff;--t:#12303a;--m:#627782;--p:#0f766e;--pt:#fff;--a:#f0b429;--r:#c62828;--b:#d5e3e5;--h:linear-gradient(135deg,#0f766e,#17a398)}
:root[data-theme=night]{--bg:#0d131a;--c:#17212b;--t:#e8eef4;--m:#93a1b0;--p:#c9a86a;--pt:#0a2438;--a:#c9a86a;--r:#ff7b7b;--g:#4fd18b;--b:#2a3745;--h:linear-gradient(135deg,#08111a,#12283a)}
:root[data-theme=emerald]{--bg:#eef4ee;--c:#fff;--t:#12301f;--m:#5d7566;--p:#1b5e3a;--a:#d4af37;--r:#b3261e;--b:#d3e2d6;--h:linear-gradient(135deg,#0f3b25,#1f7a4a)}
:root[data-theme=ruby]{--bg:#f8eff1;--c:#fff;--t:#34131a;--m:#86666d;--p:#7a1f33;--a:#d9b36c;--r:#b3261e;--b:#ead3d7;--h:linear-gradient(135deg,#5a1424,#9a2a43)}
:root[data-theme=sand]{--bg:#f3ece1;--c:#fbf7f0;--t:#3a2e22;--m:#85755f;--p:#8a5a2b;--pt:#fff;--a:#c98a3d;--r:#a63a2a;--g:#2f7a46;--b:#e0d3bd;--h:linear-gradient(135deg,#6e4520,#a8743c)}
*{box-sizing:border-box}html,body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--h);color:#f3e3b8;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--a)}
header b{flex:1;font-size:18px}header small{font-size:11px;opacity:.9}header button{background:rgba(255,255,255,.15);color:#f3e3b8;padding:7px 11px;border-color:transparent}
.plate{background:#f6f0e2;border-radius:10px;padding:4px 8px;display:inline-flex}.plate img{height:26px}
button,.btn{background:var(--p);color:var(--pt);border:1px solid var(--a);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
button.g{background:transparent;color:var(--t)}button.d{background:var(--r);color:#fff;border-color:var(--r)}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font-family:inherit}
main{padding:12px 12px 96px;max-width:760px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.row>*{flex:1}.row .s{flex:0 0 auto}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}#drawer.on{display:block}
#drawer nav{position:absolute;right:0;top:0;bottom:0;width:250px;background:var(--c);padding:16px 10px;overflow:auto;border-left:3px solid var(--a)}
#drawer nav a{display:block;padding:12px;border-radius:10px;cursor:pointer}#drawer nav a:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.tile{background:var(--c);border:1px solid var(--b);border-top:4px solid var(--a);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;font-size:30px;box-shadow:var(--sh)}.tile span{display:block;font-size:14px;margin-top:6px}
.tile.sel{outline:3px solid var(--a)}.sw{display:block!important;height:34px;border-radius:10px;margin:0 0 6px!important}.th{font-size:14px;padding:10px}
.banner{background:var(--h);color:#f3e3b8;border-radius:16px;padding:16px;margin-bottom:12px;border-bottom:4px solid var(--a)}
.hero{border:2px solid var(--a);text-align:center}.big{font-size:20px;font-weight:900;margin-top:6px}
.debt{font-weight:900;color:var(--r)}.cr{color:var(--g);font-weight:700}.m{color:var(--m);font-size:13px}
.rr{background:var(--c);border:1px solid var(--b);border-right:5px solid var(--a);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.rr input,.rr select{font-size:17px;padding:13px 10px}.rh{display:flex;justify-content:space-between;color:var(--m);margin-bottom:6px}.r3{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:6px;margin-top:6px}.rt{margin-top:8px;color:var(--m)}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:right;font-size:14px}th{color:var(--a)}
.tabs{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.tabs button{flex:1;background:transparent;color:var(--t)}.tabs .on{background:var(--a);color:#0a2438;font-weight:bold}
summary{cursor:pointer;font-weight:bold}
#login{max-width:340px;margin:8vh auto;padding:22px;text-align:center;background:var(--c);border-radius:22px;box-shadow:var(--sh);border:1px solid var(--b);border-top:5px solid var(--a)}#login .plate{padding:10px 20px}#login .plate img{height:84px}
footer{text-align:center;color:var(--m);font-size:12px;padding:16px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:2px solid var(--a);padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));z-index:6}
#bar a{flex:1;text-align:center;padding:8px 2px;font-size:20px;cursor:pointer}#bar small{display:block;font-size:11px;color:var(--m)}
#md,#md2,#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow:auto;display:flex;justify-content:center;padding:16px}#md .card,#md2 .card{margin-top:20vh;width:100%;max-width:360px;height:fit-content}.ovb{width:100%;max-width:520px}.ovb img{width:100%;border-radius:12px;margin-bottom:10px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--p);color:var(--pt);border:1px solid var(--a);padding:10px 18px;border-radius:22px;z-index:30}
.lc{width:116px;height:116px;border-radius:50%;background:radial-gradient(#fffdf6,#efe5cc);border:4px solid var(--a);box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex:none}.lc img{width:80%;height:80%;object-fit:contain}.lc.sm{width:44px;height:44px;border-width:2px;box-shadow:none}.lc.lg{width:160px;height:160px;margin:0 auto 10px}
.hb{display:flex;align-items:center;gap:14px;background:var(--h);color:#f3e3b8;border-radius:20px;padding:16px;margin-bottom:12px;border-bottom:4px solid var(--a);box-shadow:var(--sh)}.hc{flex:1;text-align:center}.clock{font-size:38px;font-weight:900;letter-spacing:1px;color:#fff;direction:ltr}.hdate{font-size:15px;margin-top:4px}.hn{font-size:13px;opacity:.85;margin-top:6px}
.av{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--a);margin-bottom:6px}
@media print{header,footer,#bar,#drawer,.np,.toast{display:none!important}}
</style></head><body>
